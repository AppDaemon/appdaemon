[project]
name = "appdaemon"
description = "Apps for the Home Assistant home automation package."
readme = "README.md"
authors = [
    {name = "Andrew I Cockburn", email = "appdaemon@acockburn.com"}
]
version = "4.5.14"
license-files = [ "LICENSE.md" ]
requires-python = ">=3.10,<3.14"
keywords=[ "appdaemon", "home", "automation" ]
dependencies = [
    "aiohttp >= 3.9.0",
    "aiohttp_jinja2>=1.5.1",
    "astral>=3.2",
    "bcrypt>=4.0.1",
    "deepdiff>=8.2.0",
    "feedparser>=6.0.10",
    "paho-mqtt>=1.6.1,<3",
    "pid>=3.0.4",
    "python-dateutil>=2.8.2",
    "python-socketio>=5.5",
    "pytz>=2022.7.1",
    "pyyaml>=6.0.1",
    "requests>=2.28.2",
    "sockjs>=0.11",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "tomli>=2.2.1",
    "tomli_w>=1.0",
    "pydantic>=2.10.6,<3"
]

classifiers= [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.urls]
documentation = "https://appdaemon.readthedocs.io"
repository = "https://github.com/AppDaemon"
changelog = "https://github.com/AppDaemon/appdaemon/blob/master/docs/HISTORY.rst"

[dependency-groups]
dev = [
    "build>=1.2.1",
    "gitpython>=3.1.43",
    "pre-commit>=3.8.0",
    "rich>=13.8.0",
    "ruff>=0.6.3",
]

test = [
    "pytest>=8.3.2",
    "pytest-asyncio>=1.0.0",
]

jupyter = [
    "ipykernel>=6.29.5",
    "notebook>=7.3.2",
]

# Dependencies required to build the documentation using sphinx
doc = [
    "myst-parser>=4.0.0",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-rtd-theme>=3.0.2",
    "sphinx-copybutton>=0.5.2",
    "pygments>=2.14",
    "pytest>=8.3.2",
    "pytest-asyncio>=1.0.0",
]

# Define the main CLI script
[project.scripts]
appdaemon = "appdaemon.__main__:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "appdaemon"
module-root = ""

# https://docs.pytest.org/en/stable/explanation/goodpractices.html
[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
addopts = ["--import-mode=importlib"]
markers = [
    "ci: mark test to run in CI environment",
    "functional: mark test as functional test",
    "unit: mark test as unit test"
]

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = ".git*,*.svg,*.css,*.min.*,*.map,assets,.venv*,.docs_build,*.js"
check-hidden = true
# ignore-regex = ""
ignore-words-list = "hass,noone,dependee,dependees,whet,controle,caf"
