# Builds the Docker image, without pushing, on pull requests that change its inputs.
# Only linux/arm/v7: it compiles native dependencies (e.g. uvloop) from source, since there are no
# musllinux wheels for it, so it is the platform a dependency or base image change breaks first.
name: Docker build check

on:
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker-pr.yml

permissions:
  contents: read

concurrency:
  group: docker-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_image:
    name: Docker image (linux/arm/v7)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
      - name: Build Python package
        run: uv build --wheel
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4.1.0
      - name: Build Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/arm/v7
          cache-from: type=gha
