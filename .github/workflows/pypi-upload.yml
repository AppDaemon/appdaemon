name: PyPI Upload

on:
  workflow_run:
    workflows: ["Python CI"]
    types:
      - completed

jobs:
  # Only publish on successful CI runs for pushes of a release tag (e.g. 4.5.14, 4.6.0b1)
  # (for a tag push, Python CI's head_branch is the tag name)
  check_tag:
    name: Check tag
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check for release tag
        id: check
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$HEAD_BRANCH" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]] &&
            [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$HEAD_BRANCH" --jq .sha)" = "$HEAD_SHA" ]; then
            echo "tag=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: check_tag
    if: needs.check_tag.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      UV_LOCKED: true
      UV_COMPILE_BYTECODE: true
      UV_NO_EDITABLE: true
      UV_NO_PROGRESS: true
      UV_NO_SYNC: true

    steps:
      # Run the release's own functional tests, not the default branch's
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.check_tag.outputs.tag }}

      - name: Install uv and set the python version
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          # https://docs.astral.sh/uv/guides/integration/github/#using-uv-in-github-actions
          # It is considered best practice to pin to a specific uv version
          version: "0.9.26"
          # https://github.com/astral-sh/setup-uv?tab=readme-ov-file#enable-caching
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download Python package artifact
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install python dependencies
        run: uv sync --locked --no-install-project --no-editable --no-dev --group test

      - name: Install package from wheel
        run: uv pip install dist/*.whl

      - name: Run functional tests
        run: uv run pytest -m functional

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
