# Builds and publishes multi-platform Docker images after Python Build completes successfully.
# Pushes to Docker Hub on version tags (v*) or dev branch.
# Also rebuilds `dev` and the latest release weekly, so published images pick up base image (OS) security fixes.
name: Build and Deploy Docker Image

on:
  workflow_run:
    workflows: ["Python CI"]
    branches: ['**']
    types:
      - completed
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

# Cancel a currently running workflow from the same PR, branch or tag when a new workflow is triggered:
concurrency:
  group: docker-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

env:
  # github.repository as <account>/<repo>
  IMAGE_NAME: acockburn/appdaemon

jobs:
  # After building the Python package, build the Docker image
  build_image:
    name: Docker image${{ matrix.ref && format(' ({0})', matrix.ref) || '' }}
    runs-on: ubuntu-latest
    # Only run if tests passed and it's dev branch or a version tag (or it's a scheduled/manual rebuild)
    if: |
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.head_branch == 'dev' ||
          startsWith(github.event.workflow_run.head_branch, 'v')
        )
      )
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Rebuilds cover `dev` and the latest release; a workflow_run builds the default checkout once ('')
        ref: ${{ fromJSON(github.event_name == 'workflow_run' && '[""]' || '["dev", "latest-release"]') }}

    steps:
      - name: Resolve latest release tag
        id: release
        if: matrix.ref == 'latest-release'
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag || matrix.ref }}
      # Rebuilds have no Python CI run to take the package from, so build it from the checked out ref
      - name: Install uv
        if: github.event_name != 'workflow_run'
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Build Python package
        if: github.event_name != 'workflow_run'
        run: uv build --wheel
      - name: Download Python package
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4.1.0
      # Login against a Docker registry (only with a tag or push on `dev` branch)
      # https://github.com/docker/login-action
      - name: Log into Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          # Derive tags from the checked out ref (identical to the workflow context on workflow_run, which checks out
          # the default branch), so a rebuilt release keeps its version + `latest` tags instead of becoming `dev`
          context: git
          images: ${{ env.IMAGE_NAME }}
          # Customize the generation of Docker `latest` tag
          # Tag with `latest` the git tags that do not have a "pre-release" component in the end (e.g. `3.0.0`)
          # Avoid tagging with `latest` the git tag that have a "pre-release" component in the end (e.g. `3.0.0b1`)
          # If no git tag, fallback to branch or PR name
          tags: |
            # If the git tag follows PEP440 conventions, use it as the resulting docker tag (both releases and pre-releases)
            type=pep440,pattern={{version}}

            # If the git tag does NOT have a pre-release ending (e.g. `3.0.0`), it is a release version to be tagged as `latest`
            type=match,value=latest,pattern=pattern=^\d\.\d+\.\d+$

            # If no git tag is used, fallback to tagging with branch or PR name
            type=ref,event=branch
            type=ref,event=pr

      # Build and push Docker image with Buildx (push image only with a tag or push on `dev` branch)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64/v8, linux/amd64, linux/arm/v7, linux/arm/v6
          cache-from: type=gha
          cache-to: type=gha,mode=max
